<!DOCTYPE html>
<html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>

<head>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f5f5;
            font-family: Arial;
        }

        form {
            background: #fff;
            padding: 30px;
            width: 500px;
            border-radius: 15px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        button {
            background: goldenrod;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            display: block;
            margin: auto;
        }
    </style>
</head>

<body>

    <form>

        <h2 align="center">Send me a message</h2>

        <input type="text" placeholder="Enter Your Name / Company">

        <div class="row">
            <input type="email" placeholder="Enter Your Email">
            <input type="text" placeholder="Enter Your Number">
        </div>
        <textarea rows="5" placeholder="Write Message"></textarea>
        <button>Send Message</button>

    </form>

</body>

</html>
